<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Burst: 60-Second Blitz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #090a0f;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .glow-pink {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center relative overflow-hidden">

    <!-- HUD Overlay -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-10 pointer-events-none">
        <!-- Score & Combo -->
        <div class="flex flex-col">
            <span class="text-xs uppercase tracking-widest text-gray-400 font-semibold">Score</span>
            <span id="scoreText" class="text-3xl font-black glow-text text-cyan-400">0</span>
            <div id="comboBadge" class="mt-1 opacity-0 transition-opacity duration-200">
                <span id="comboText" class="text-sm font-bold text-pink-500 glow-pink bg-pink-950/60 px-2 py-0.5 rounded-full border border-pink-500/30">x1 COMBO</span>
            </div>
        </div>

        <!-- Timer -->
        <div class="flex flex-col items-end">
            <span class="text-xs uppercase tracking-widest text-gray-400 font-semibold">Time</span>
            <div class="relative flex items-center justify-center">
                <span id="timerText" class="text-4xl font-black text-amber-400 font-mono">60</span>
                <span class="text-xs text-amber-500/80 ml-0.5">s</span>
            </div>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvasContainer" class="w-full h-full relative">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Start Overlay -->
    <div id="startScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 text-center">
        <div class="w-16 h-16 mb-4 rounded-2xl bg-gradient-to-br from-cyan-400 to-pink-500 flex items-center justify-center shadow-lg shadow-cyan-500/30 animate-pulse">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
        </div>
        <h1 class="text-4xl font-black tracking-tight mb-2 bg-gradient-to-r from-cyan-400 via-pink-500 to-amber-400 bg-clip-text text-transparent">NEON BURST</h1>
        <p class="text-gray-300 text-sm max-w-xs mb-6">Tap glowing targets before they vanish! Build combos and beat the 60-second clock!</p>

        <div class="bg-white/5 border border-white/10 rounded-xl p-4 mb-8 w-full max-w-xs">
            <div class="flex justify-between items-center text-sm mb-1">
                <span class="text-gray-400">Best Score:</span>
                <span id="startHighScore" class="font-bold text-cyan-400">0</span>
            </div>
        </div>

        <button id="startButton" class="w-full max-w-xs py-4 px-6 rounded-2xl bg-gradient-to-r from-cyan-500 to-pink-500 text-white font-extrabold text-lg shadow-lg shadow-pink-500/25 active:scale-95 transition-all">
            START 60s BLITZ
        </button>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 text-center hidden">
        <h2 class="text-2xl font-bold text-gray-300 mb-1">TIME'S UP!</h2>
        <div id="finalScore" class="text-6xl font-black text-cyan-400 glow-text my-3">0</div>
        <p class="text-xs text-gray-400 uppercase tracking-widest mb-6">Final Score</p>

        <div class="bg-white/5 border border-white/10 rounded-xl p-4 mb-6 w-full max-w-xs space-y-2">
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-400">Max Combo:</span>
                <span id="endMaxCombo" class="font-bold text-pink-400">x0</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-gray-400">Accuracy:</span>
                <span id="endAccuracy" class="font-bold text-amber-400">0%</span>
            </div>
            <div class="flex justify-between items-center text-sm pt-2 border-t border-white/10">
                <span class="text-gray-400">High Score:</span>
                <span id="endHighScore" class="font-bold text-cyan-400">0</span>
            </div>
        </div>

        <button id="restartButton" class="w-full max-w-xs py-4 px-6 rounded-2xl bg-gradient-to-r from-pink-500 to-amber-500 text-white font-extrabold text-lg shadow-lg shadow-pink-500/25 active:scale-95 transition-all">
            PLAY AGAIN
        </button>
    </div>

    <script>
        // --- Web Audio API Synth ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playHit(freq = 440, type = 'sine') {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playMiss() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playBomb() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const sfx = new SoundFX();

        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        let width, height;
        function resize() {
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State Variables
        let isPlaying = false;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let totalTaps = 0;
        let successfulHits = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let targets = [];
        let particles = [];
        let floatingTexts = [];
        let spawnTimer = 0;
        let spawnRate = 45; // Frames between spawns
        let lastTime = 0;

        // High Score Storage
        let highScore = localStorage.getItem('neon_burst_highscore') || 0;
        document.getElementById('startHighScore').innerText = highScore;

        // Target Types Definition
        const TARGET_TYPES = {
            STANDARD: { color: '#00f3ff', radius: 32, points: 100, duration: 120, type: 'standard' },
            GOLD: { color: '#ffb703', radius: 26, points: 250, duration: 80, type: 'gold' },
            BOMB: { color: '#ff0055', radius: 30, points: -200, duration: 100, type: 'bomb' },
            TIME: { color: '#00ff66', radius: 24, points: 50, extraTime: 2, duration: 75, type: 'time' }
        };

        // Class for Floating Score Text
        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1;
                this.scale = 1.2;
            }

            update() {
                this.y -= 1.5;
                this.alpha -= 0.02;
                this.scale = Math.max(1, this.scale - 0.01);
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = `900 ${18 * this.scale}px Inter, sans-serif`;
                ctx.fillStyle = this.color;
                ctx.textAlign = 'center';
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // Particle System
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 4 + 2;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.friction = 0.94;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.025;
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();
            }
        }

        // Target Object
        class Target {
            constructor() {
                const types = [TARGET_TYPES.STANDARD, TARGET_TYPES.STANDARD, TARGET_TYPES.STANDARD];
                // Spawn special types based on chance
                const rand = Math.random();
                if (rand < 0.25) types.push(TARGET_TYPES.GOLD);
                if (rand < 0.15) types.push(TARGET_TYPES.BOMB);
                if (rand < 0.10) types.push(TARGET_TYPES.TIME);

                const selected = types[Math.floor(Math.random() * types.length)];
                
                this.type = selected.type;
                this.color = selected.color;
                this.baseRadius = selected.radius;
                this.radius = 0;
                this.maxRadius = selected.radius;
                this.points = selected.points;
                this.extraTime = selected.extraTime || 0;
                
                // Safe positioning within bounds
                const margin = 50;
                this.x = margin + Math.random() * (width - margin * 2);
                this.y = margin + 60 + Math.random() * (height - margin * 2 - 60);

                this.duration = Math.max(45, selected.duration - (60 - timeLeft) * 0.8); // Speeds up over time
                this.age = 0;
                this.isDead = false;
            }

            update() {
                this.age++;
                if (this.age < 10) {
                    // Growing animation
                    this.radius = (this.age / 10) * this.maxRadius;
                } else if (this.age > this.duration - 10) {
                    // Shrinking before death
                    this.radius = Math.max(0, ((this.duration - this.age) / 10) * this.maxRadius);
                } else {
                    this.radius = this.maxRadius;
                }

                if (this.age >= this.duration) {
                    this.isDead = true;
                    return false; // Timed out (missed)
                }
                return true;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.radius), 0, Math.PI * 2);

                // Target Core Fill
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fill();

                // Progress Outer Ring
                const progress = 1 - (this.age / this.duration);
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.radius + 6), -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * progress));
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.stroke();

                // Inner Bomb Symbol or Icon Indicators
                if (this.type === 'bomb') {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px Inter';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('✕', this.x, this.y);
                } else if (this.type === 'time') {
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 14px Inter';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('+2s', this.x, this.y);
                }

                ctx.restore();
            }

            contains(tx, ty) {
                const dist = Math.hypot(this.x - tx, this.y - ty);
                return dist <= this.maxRadius + 15; // Generous tap area for touch screen
            }
        }

        // --- Game Controls & Mechanics ---
        function triggerScreenShake() {
            container.classList.remove('shake');
            void container.offsetWidth; // Force reflow
            container.classList.add('shake');
        }

        function createBurst(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function updateHUD() {
            document.getElementById('scoreText').innerText = score;
            document.getElementById('timerText').innerText = Math.max(0, timeLeft);

            const comboBadge = document.getElementById('comboBadge');
            const comboText = document.getElementById('comboText');

            if (combo > 1) {
                comboBadge.style.opacity = '1';
                comboText.innerText = `x${combo} COMBO`;
            } else {
                comboBadge.style.opacity = '0';
            }
        }

        function handleTap(e) {
            if (!isPlaying) return;

            // Normalize event coordinates for touch or click
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const tapX = clientX - rect.left;
            const tapY = clientY - rect.top;

            totalTaps++;
            let hit = false;

            for (let i = targets.length - 1; i >= 0; i--) {
                const target = targets[i];
                if (target.contains(tapX, tapY)) {
                    hit = true;
                    successfulHits++;
                    targets.splice(i, 1);

                    if (target.type === 'bomb') {
                        // Penalty Bomb Hit
                        combo = 0;
                        score = Math.max(0, score + target.points);
                        createBurst(target.x, target.y, '#ff0055', 20);
                        floatingTexts.push(new FloatingText(target.x, target.y, `${target.points}`, '#ff0055'));
                        sfx.playBomb();
                        triggerScreenShake();
                    } else {
                        // Successful Target Hit
                        combo++;
                        maxCombo = Math.max(maxCombo, combo);

                        if (target.type === 'time') {
                            timeLeft += target.extraTime;
                        }

                        const pointsEarned = target.points * (1 + Math.floor(combo / 5) * 0.5);
                        score += Math.round(pointsEarned);

                        createBurst(target.x, target.y, target.color, 14);
                        floatingTexts.push(new FloatingText(target.x, target.y, `+${Math.round(pointsEarned)}`, target.color));
                        
                        sfx.playHit(300 + combo * 20, 'sine');

                        if (combo % 10 === 0) {
                            triggerScreenShake();
                        }
                    }
                    break;
                }
            }

            if (!hit) {
                // Missed tap
                combo = 0;
                sfx.playMiss();
            }

            updateHUD();
        }

        // Attach touch/click listeners
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap(e);
        }, { passive: false });

        canvas.addEventListener('mousedown', handleTap);

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, width, height);

            // Dynamic Target Spawning Rate Scaling based on Time Left
            const progress = (60 - timeLeft) / 60;
            spawnRate = Math.max(20, 45 - progress * 25);

            spawnTimer++;
            if (spawnTimer >= spawnRate) {
                spawnTimer = 0;
                if (targets.length < 6) {
                    targets.push(new Target());
                }
            }

            // Update & Render Targets
            for (let i = targets.length - 1; i >= 0; i--) {
                const target = targets[i];
                if (!target.update()) {
                    // Target expired without being tapped
                    targets.splice(i, 1);
                    if (target.type !== 'bomb') {
                        combo = 0; // Break combo on standard miss
                        updateHUD();
                    }
                } else {
                    target.draw();
                }
            }

            // Update & Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                if (!p.update()) {
                    particles.splice(i, 1);
                } else {
                    p.draw();
                }
            }

            // Update & Render Floating Score Texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                if (!ft.update()) {
                    floatingTexts.splice(i, 1);
                } else {
                    ft.draw();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // --- Game Lifecycle ---
        function startGame() {
            sfx.init();

            // Reset Game Metrics
            score = 0;
            combo = 0;
            maxCombo = 0;
            totalTaps = 0;
            successfulHits = 0;
            timeLeft = 60;
            targets = [];
            particles = [];
            floatingTexts = [];
            isPlaying = true;

            updateHUD();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');

            // Countdown Timer Tracker
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateHUD();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);

            // Calculate Highscore and Accuracy Stats
            const accuracy = totalTaps > 0 ? Math.round((successfulHits / totalTaps) * 100) : 0;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_burst_highscore', highScore);
            }

            // Display Results Screen
            document.getElementById('finalScore').innerText = score;
            document.getElementById('endMaxCombo').innerText = `x${maxCombo}`;
            document.getElementById('endAccuracy').innerText = `${accuracy}%`;
            document.getElementById('endHighScore').innerText = highScore;
            document.getElementById('startHighScore').innerText = highScore;

            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // Event Listeners for UI Buttons
        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('restartButton').addEventListener('click', startGame);

    </script>
</body>
</html>
